<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samsung Price Garden</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="sparkles" aria-hidden="true"></div>

  <header class="hero">
    <h1 class="title">Samsung Price Garden &#127812;&#128241;</h1>

  <main id="grid" class="grid"></main>

    <p>Prices are approximate US MSRP &nbsp;&#128154;&nbsp; Made with love</p>
  </footer>

  <script src="script.js"></script>
